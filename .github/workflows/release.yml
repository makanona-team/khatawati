name: بناء ونشر خطواتي

# يبني التطبيق عند كل دفع. إذا وُجد السر SIGN_PASS ولم يُنشر الإصدار الحالي بعد: يوقّعه وينشره في Releases.
# نتيجة كل بناء تُحفظ في الفرع build-logs (ملف last.txt) لمراجعة الأخطاء.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: الفحص (check)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VN" >> "$GITHUB_ENV"
          PUBLISHED=false
          if gh release view "v$VN" >/dev/null 2>&1; then PUBLISHED=true; fi
          SIGNED=false
          if [ -n "$SIGN_PASS" ]; then SIGNED=true; fi
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$PUBLISHED" = true ] || [ "$SIGNED" = false ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.skip != 'true'

      - name: فك تشفير مفتاح التوقيع (decrypt key)
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.signed == 'true'
        env:
          SIGN_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in .github/signing/khatawati.jks.enc -out "$RUNNER_TEMP/k.jks" -pass env:SIGN_PASS
          echo "KH_KEYSTORE=$RUNNER_TEMP/k.jks" >> "$GITHUB_ENV"

      - name: البناء (build)
        if: steps.check.outputs.skip != 'true'
        env:
          KH_PASS: ${{ secrets.SIGN_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$KH_KEYSTORE" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew --no-daemon $TASK 2>&1 | tee build.log

      - name: حفظ نتيجة البناء (report)
        if: always() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/r"
          {
            echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}  status: ${{ job.status }}  signed: ${{ steps.check.outputs.signed }}"
            echo "===== errors ====="
            grep -nE "error:|e: |FAILED|What went wrong|Exception|AAPT|resource .* not found" build.log 2>/dev/null | head -150
            echo "===== tail ====="
            tail -n 120 build.log 2>/dev/null
          } > "$RUNNER_TEMP/r/last.txt"
          cd "$RUNNER_TEMP/r"
          git init -q
          git checkout -q -b build-logs
          git add last.txt
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "build log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs

      - name: ملاحظات الإصدار (notes)
        if: success() && steps.check.outputs.skip != 'true' && steps.check.outputs.signed == 'true' && steps.check.outputs.published == 'false'
        run: |
          F="changelogs/$VERSION.md"
          if [ -f "$F" ]; then cp "$F" "$RUNNER_TEMP/notes.md"; else echo "تحسينات وإصلاحات." > "$RUNNER_TEMP/notes.md"; fi
          {
            echo ""
            echo "---"
            echo "**التثبيت:** حمّل \`Khatawati-$VERSION.apk\` من الأسفل وافتحه على الهاتف. التحديثات التالية من داخل التطبيق: الإعدادات ← البحث عن تحديثات."
          } >> "$RUNNER_TEMP/notes.md"

      - name: نشر الإصدار (release)
        if: success() && steps.check.outputs.skip != 'true' && steps.check.outputs.signed == 'true' && steps.check.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: خطواتي ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/outputs/apk/release/Khatawati-*.apk
